<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>$GODOT_PROJECT_NAME</title>
<!-- Экран загрузки «Шикаку: Блоки» (этап 16.4, docs/STYLE.md, раздел 11.4). Оболочка экспорта Godot:
     html/custom_html_shell = res://web/shell.html. Фон — как у игры (shaders/background.gdshader: градиент,
     светлое пятно сверху, виньетка), четыре блока подпрыгивают по кругу, под ними — полоса загрузки. Текста нет:
     язык до старта игры неизвестен. Проверка без браузера — tools/check_shell.py, кадр — tools/loading_preview.py. -->
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; }
body {
	overflow: hidden; touch-action: none; overscroll-behavior: none; color: #fff;
	background: #6A42E4 linear-gradient(180deg, #4A36E0 0%, #6A42E4 50%, #9A4CDB 100%) fixed;
	-webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
	font-family: "Nunito", "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800;
}
#canvas { display: block; position: fixed; left: 0; top: 0; }
/* #frame — всё окно iframe; по нему IntersectionObserver узнаёт, какая часть окна реально видна (правка 12.10). */
#frame { position: fixed; inset: 0; opacity: 0; pointer-events: none; z-index: -1; }
#canvas:focus { outline: none; }
#status {
	position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
	/* Как фон игры: виньетка #140646 47 % от 0,6 до 1 радиуса (0,62 диагонали = 71vmax при 16:9 и 9:16, центр
	   50 % / 45 %), белое пятно 19 % с линейным спадом (радиус 0,75 большей стороны, центр 50 % / 20 %), градиент. */
	background: radial-gradient(circle 71vmax at 50% 45%, rgba(20, 6, 70, 0) 60%, rgba(20, 6, 70, 0.47) 100%),
		radial-gradient(circle 75vmax at 50% 20%, rgba(255, 255, 255, 0.188) 0%, rgba(255, 255, 255, 0) 100%),
		linear-gradient(180deg, #4A36E0 0%, #6A42E4 50%, #9A4CDB 100%);
	transition: opacity 0.35s ease-out; z-index: 10;
}
#status.hidden { opacity: 0; pointer-events: none; }
#status.gone { display: none; }
/* Логотип: 2×2 блока как в игре — лицо, светлый блик, тёмная «губа» снизу. */
/* Зазор 12 px больше прыжка (9 px + растяжение 1,3 px): нижний ряд не наезжает на верхний. */
#logo { display: grid; grid-template-columns: repeat(2, 64px); gap: 12px; margin-bottom: 44px; }
.block {
	width: 64px; height: 64px; border-radius: 16px; position: relative;
	box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.22), 0 8px 14px rgba(20, 6, 70, 0.35);
	animation: hop 1.6s ease-in-out infinite;
}
.block::after {
	content: ""; position: absolute; left: 10px; top: 8px; width: 22px; height: 10px; border-radius: 6px;
	background: rgba(255, 255, 255, 0.45);
}
.b1 { background: #FF4B3E; animation-delay: 0s; }
.b2 { background: #FFD23F; animation-delay: 0.2s; }
.b3 { background: #3F7BFF; animation-delay: 0.6s; }
.b4 { background: #2FD67B; animation-delay: 0.4s; }
@keyframes hop {
	0%, 60%, 100% { transform: translateY(0) scale(1, 1); }
	20% { transform: translateY(-9px) scale(0.96, 1.04); }
	40% { transform: translateY(0) scale(1.06, 0.94); }
}
/* Полоса: светлый жёлоб, жёлтая заливка (Palette.SCORE) с губой; без размера — бегущие полосы. */
#bar {
	width: min(320px, 70vw); height: 22px; border-radius: 11px; overflow: hidden; position: relative;
	background: rgba(255, 255, 255, 0.22); box-shadow: inset 0 3px 0 rgba(20, 6, 70, 0.25);
}
#fill {
	position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 11px;
	background: #FFE45C; box-shadow: inset 0 -5px 0 rgba(176, 110, 0, 0.35);
	transition: width 0.25s ease-out;
}
#bar.unknown #fill {
	width: 100%; transition: none;
	background: repeating-linear-gradient(-45deg, #FFE45C 0 14px, #FFD23F 14px 28px);
	background-size: 40px 22px; animation: stripes 0.8s linear infinite;
}
@keyframes stripes { from { background-position: 0 0; } to { background-position: 40px 0; } }
#notice {
	display: none; max-width: min(520px, 86vw); margin-top: 28px; padding: 16px 22px; border-radius: 18px;
	background: rgba(255, 255, 255, 0.95); color: #2E1678; font-size: 18px; line-height: 1.35;
	text-align: center; white-space: pre-line;
}
#status.failed #notice { display: block; }
#status.failed #bar { display: none; }  /* застывшая полоса рядом с ошибкой сбивает с толку */
#status.failed .block { animation: none; }
@media (prefers-reduced-motion: reduce) {
	.block, #bar.unknown #fill { animation: none; }
	#status { transition: none; }
}
</style>
<script>
// Яндекс Метрика (этап 16.1, README «Аналитика»). METRIKA_ID — номер счётчика, единственное место в проекте;
// 0 — Метрика выключена: тег не грузится, цели никуда не уходят. Тег грузится с начала страницы, раньше движка:
// так видны и те, кто ушёл, не дождавшись загрузки. Цели игры приходят через window.ShikakuMetrika.goal
// (autoload/analytics.gd), оболочка сама шлёт load_done (сколько секунд от открытия страницы до старта движка)
// и load_error. Проверка без браузера — tools/check_shell.py.
var METRIKA_ID = 113726044;
(function (w, d) {
	var M = { id: METRIKA_ID, done: false };
	var t0 = Date.now();
	// Интервалы секунд в параметрах целей — те же, что Analytics.SPAN_EDGES в игре (сверяет check_shell.py).
	var SPAN_EDGES = [3, 5, 10, 20, 30, 60, 120, 300];
	M.span = function (sec) {
		var lo = 0;
		for (var i = 0; i < SPAN_EDGES.length; i++) {
			if (sec < SPAN_EDGES[i]) { return lo + '-' + SPAN_EDGES[i]; }
			lo = SPAN_EDGES[i];
		}
		return lo + '+';
	};
	// Секунды от открытия страницы (performance.now — от начала навигации, иначе — от этого скрипта).
	M.seconds = function () {
		var p = w.performance;
		return (p && typeof p.now === 'function' ? p.now() : Date.now() - t0) / 1000;
	};
	// Цель name с параметрами params (объект или JSON-строка из игры). false — счётчика нет.
	M.goal = function (name, params) {
		if (!M.id) { return false; }
		var p = params;
		if (typeof p === 'string') {
			try { p = p ? JSON.parse(p) : undefined; } catch (e) { p = undefined; }
		}
		try { w.ym(M.id, 'reachGoal', String(name), p); } catch (e) { return false; }
		return true;
	};
	// Итог загрузки из скрипта запуска (один раз): движок стартовал или нет (kind — 'start' / 'features').
	M.loaded = function (ok, kind) {
		if (M.done) { return; }
		M.done = true;
		var sec = M.span(M.seconds());
		if (ok) {
			M.goal('load_done', { load_done: { sec: sec } });
		} else {
			var info = {};
			info[String(kind || 'start')] = sec;
			M.goal('load_error', { load_error: info });
		}
	};
	w.ShikakuMetrika = M;
	if (!M.id) { return; }
	// Стандартный код счётчика: очередь ym до загрузки тега, тег — асинхронно. Вебвизор и карта кликов не нужны
	// (холст — одна картинка), точный показатель отказов — да.
	w.ym = w.ym || function () { (w.ym.a = w.ym.a || []).push(arguments); };
	w.ym.l = 1 * new Date();
	var tag = d.createElement('script');
	tag.async = true;
	tag.src = 'https://mc.yandex.ru/metrika/tag.js';
	d.head.appendChild(tag);
	w.ym(M.id, 'init', { clickmap: false, trackLinks: false, accurateTrackBounce: true, webvisor: false });
}(window, document));
</script>
$GODOT_HEAD_INCLUDE
</head>
<body>
<div id="frame"></div>
<canvas id="canvas">HTML5 canvas is not supported.</canvas>
<noscript>JavaScript is required.</noscript>
<div id="status">
	<div id="logo"><div class="block b1"></div><div class="block b2"></div><div class="block b3"></div><div class="block b4"></div></div>
	<div id="bar" class="unknown"><div id="fill"></div></div>
	<div id="notice"></div>
</div>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const status = document.getElementById('status');
	const bar = document.getElementById('bar');
	const fill = document.getElementById('fill');
	const notice = document.getElementById('notice');
	// До старта игры язык Яндекса неизвестен: текст ошибки — по языку браузера (ru / tr / остальное — en).
	const lang = String(navigator.language || 'en').slice(0, 2).toLowerCase();
	const TEXT = {
		ru: { failed: 'Не удалось запустить игру. Обновите страницу.', missing: 'Браузер не поддерживает нужные функции:',
			browser: 'Откройте игру в другом браузере или обновите этот.' },
		tr: { failed: 'Oyun başlatılamadı. Sayfayı yenileyin.', missing: 'Tarayıcı gerekli özellikleri desteklemiyor:',
			browser: 'Oyunu başka bir tarayıcıda açın veya bu tarayıcıyı güncelleyin.' },
		en: { failed: 'The game failed to start. Please reload the page.', missing: 'Your browser lacks required features:',
			browser: 'Please open the game in another browser or update this one.' },
	};
	const t = TEXT[lang] || TEXT.en;
	let shown = 0;  // доля на полосе: только растёт, до старта движка — не больше 0,99

	// ПКМ без меню браузера и без выделения (docs/DESKTOP.md, раздел 5): и над холстом, и над экраном загрузки.
	document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			shown = Math.max(shown, Math.min(0.99, current / total));
			bar.classList.remove('unknown');
			fill.style.width = (shown * 100).toFixed(1) + '%';
		} else if (shown === 0) {
			bar.classList.add('unknown');  // размер не пришёл (сжатие без Content-Length) — бегущие полосы
		}
	}

	function hide() {
		bar.classList.remove('unknown');
		fill.style.width = '100%';
		status.classList.add('hidden');
		setTimeout(function () { status.classList.add('gone'); }, 400);
	}

	function show(text) {
		notice.textContent = text;
		status.classList.remove('hidden', 'gone');
		status.classList.add('failed');
	}

	// Сбой запуска: «обновите страницу» и техническая причина (её пришлют в отзыве или скриншоте).
	function fail(err) {
		const msg = (err && err.message) || String(err || '');
		show(msg ? t.failed + '\n\n' + msg : t.failed);
		console.error(err);
	}

	// Браузеру не хватает функций: перезагрузка не поможет — список и совет сменить или обновить браузер.
	function failMissing() {
		show(t.missing + '\n' + missing.join('\n') + '\n\n' + t.browser);
		loaded(false, 'features');
	}

	// Итог загрузки — в Метрику (16.1; без счётчика ShikakuMetrika ничего не шлёт).
	function loaded(ok, kind) {
		const m = window.ShikakuMetrika;
		if (m && typeof m.loaded === 'function') { m.loaded(ok, kind); }
	}

	// --- Размер холста (правка 12.10, «на десктопе в черновике игра обрезана»). Яндекс может дать iframe больше,
	// чем видимая область (её режет контейнер страницы), а Godot с canvas_resize_policy = 2 растягивает холст на
	// всё окно iframe — низ и правый край пропадали. Теперь холстом управляет оболочка (canvasResizePolicy: 0):
	// размер — видимая часть окна по IntersectionObserver (учитывает обрезку родительской страницей), без него —
	// всё окно. Экран загрузки — в той же области.
	const canvas = document.getElementById('canvas');
	const frame = document.getElementById('frame');
	let clip = null;  // видимая часть окна {x, y, w, h} или null — видно всё окно
	function place(el, x, y, w, h) {
		if (!el || !el.style) { return; }
		el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
		el.style.right = 'auto'; el.style.bottom = 'auto';
	}
	function fit() {
		if (!canvas || !canvas.style) { return; }
		const de = document.documentElement || {};
		const W = window.innerWidth || de.clientWidth || 0;
		const H = window.innerHeight || de.clientHeight || 0;
		if (!W || !H) { return; }
		let x = 0, y = 0, w = W, h = H;
		if (clip) {
			x = Math.max(0, clip.x); y = Math.max(0, clip.y);
			w = Math.min(clip.w, W - x); h = Math.min(clip.h, H - y);
		}
		const dpr = window.devicePixelRatio || 1;
		const cw = Math.max(1, Math.round(w * dpr));
		const ch = Math.max(1, Math.round(h * dpr));
		place(canvas, x, y, w, h);
		place(status, x, y, w, h);
		if (canvas.width !== cw) { canvas.width = cw; }
		if (canvas.height !== ch) { canvas.height = ch; }
	}
	if (typeof window.addEventListener === 'function') {
		window.addEventListener('resize', fit);
		if (typeof window.IntersectionObserver === 'function' && frame) {
			const steps = [];
			for (let i = 0; i <= 100; i++) { steps.push(i / 100); }
			const io = new window.IntersectionObserver(function (entries) {
				const e = entries[entries.length - 1];
				const r = e && e.intersectionRect;
				const W = window.innerWidth, H = window.innerHeight;
				// Не видно вовсе (вкладка в фоне, прокрутили) или крошечный кусок — размер не трогаем.
				if (!r || !e.isIntersecting || r.width < 160 || r.height < 160 || !W || !H) { return; }
				const full = r.left <= 1 && r.top <= 1 && r.right >= W - 1 && r.bottom >= H - 1;
				const next = full ? null : { x: Math.round(r.left), y: Math.round(r.top),
					w: Math.floor(r.width), h: Math.floor(r.height) };
				if (JSON.stringify(next) !== JSON.stringify(clip)) {
					clip = next;
					fit();
				}
			}, { threshold: steps });
			const recheck = function () { io.unobserve(frame); io.observe(frame); };
			io.observe(frame);
			window.addEventListener('resize', recheck);
			setInterval(recheck, 1000);  // страница Яндекса меняет раскладку без resize в iframe
		}
	}
	fit();

	// --- Звук при уходе со вкладки (правка 12.10, модерация: «звук продолжается при переключении вкладки»).
	// В скрытой вкладке кадры Godot стоят, и выключение звука из игры (GameState.set_audio_suspended) не успевает
	// сработать, а Web Audio играет дальше. Поэтому оболочка сама ставит AudioContext движка на паузу: вкладка
	// скрыта, страница уходит, окно потеряло фокус — suspend; вернулись (видно и фокус или касание) — resume.
	(function () {
		const Orig = window.AudioContext || window.webkitAudioContext;
		if (typeof Orig !== 'function') { return; }
		const list = [];
		let hidden = !!document.hidden;
		let blurred = false;
		function muted() { return hidden || blurred; }
		function apply() {
			const m = muted();
			list.forEach(function (c) {
				try {
					if (m && c.state === 'running') { c._shikakuSuspend.call(c); }
					else if (!m && c.state !== 'running' && c.state !== 'closed') { c._shikakuResume.call(c); }
				} catch (e) {}
			});
		}
		const Guarded = function (opts) {
			const c = opts === undefined ? new Orig() : new Orig(opts);
			const resume = c.resume;
			c._shikakuResume = resume;
			c._shikakuSuspend = c.suspend;
			// Движок будит звук на каждое касание; пока вкладка скрыта или без фокуса — не даём.
			c.resume = function () { return muted() ? Promise.resolve() : resume.apply(c, arguments); };
			list.push(c);
			if (muted()) { try { c.suspend(); } catch (e) {} }
			return c;
		};
		Guarded.prototype = Orig.prototype;
		if (window.AudioContext) { window.AudioContext = Guarded; }
		if (window.webkitAudioContext) { window.webkitAudioContext = Guarded; }
		function onVisibility() { hidden = !!document.hidden; apply(); }
		function onGesture() { blurred = false; hidden = !!document.hidden; apply(); }
		document.addEventListener('visibilitychange', onVisibility);
		window.addEventListener('pagehide', function () { hidden = true; apply(); });
		window.addEventListener('pageshow', onVisibility);
		window.addEventListener('blur', function () { blurred = true; apply(); });
		window.addEventListener('focus', function () { blurred = false; apply(); });
		['pointerdown', 'touchstart', 'mousedown', 'keydown'].forEach(function (t) {
			window.addEventListener(t, onGesture, true);
		});
		window.ShikakuAudio = { muted: muted, contexts: list };
	}());

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		// Как в оболочке Godot: сервис-воркер (только с PWA, у нас выключено) может включить недостающее —
		// ставим и перезагружаем. Но один раз за сессию вкладки: если воркер уже стоит, установка не удалась или
		// после перезагрузки функций всё равно нет — ошибка на экране, а не перезагрузка по кругу.
		let store = null;
		try { store = window.sessionStorage; } catch (e) { store = null; }
		const RELOAD_KEY = 'shikaku_sw_reload';
		let tried = true;
		try { tried = !store || store.getItem(RELOAD_KEY) === '1'; } catch (e) { tried = true; }
		if (!tried && GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders']
				&& 'serviceWorker' in navigator) {
			let registration;
			try {
				registration = Promise.resolve(navigator.serviceWorker.getRegistration());
			} catch (err) {
				registration = Promise.reject(err);
			}
			Promise.race([
				registration.then(function (reg) {
					if (reg != null) { return Promise.reject(new Error('Service worker already exists.')); }
					return engine.installServiceWorker();
				}),
				new Promise(function (resolve) { setTimeout(resolve, 2000); }),  // getRegistration() бывает зависает
			]).then(function () {
				try { store.setItem(RELOAD_KEY, '1'); } catch (e) { failMissing(); return; }
				window.location.reload();
			}, function (err) {
				console.error('Service worker:', err);
				failMissing();
			});
		} else {
			failMissing();
		}
		return;
	}
	// --- Запуск (правка 12.10, iPhone 7 «висит на полной полосе»). Загрузчик Godot глотает часть ошибок
	// (сбой компиляции wasm, нехватка памяти, зависший IndexedDB): обещание startGame не завершается никогда.
	// Поэтому: 1) ловим необработанные ошибки во время запуска и показываем их; 2) заранее пробуем IndexedDB —
	// не ответил за 4 с, запускаем без него (persistentPaths: [], прогресс тогда держит облако Яндекса);
	// 3) сторож: 45 с после полной загрузки без старта — текст ошибки с причиной вместо вечной полосы.
	let settled = false;
	const errors = [];
	function note(text) {
		text = String(text || '').slice(0, 300);
		if (text && errors.length < 6) { errors.push(text); }
	}
	function bootFailed(err, kind) {
		if (settled) { return; }
		settled = true;
		fail(err);
		loaded(false, kind || 'start');
	}
	function fatal(reason) {
		const name = String((reason && reason.name) || '');
		const msg = String((reason && reason.message) || reason || '');
		return /CompileError|LinkError|RuntimeError|RangeError/.test(name)
			|| /wasm|webassembly|out of memory|memory|abort/i.test(msg);
	}
	if (typeof window.addEventListener === 'function') {
		window.addEventListener('unhandledrejection', function (e) {
			const r = e && e.reason;
			note((r && (r.name ? r.name + ': ' : '') + (r.message || r)) || r);
			if (!settled && fatal(r)) { bootFailed(r, 'wasm'); }
		});
		window.addEventListener('error', function (e) {
			note(e && (e.message || (e.error && e.error.message)));
			if (!settled && e && fatal(e.error || e.message)) { bootFailed(e.error || new Error(e.message), 'wasm'); }
		});
	}
	let loadedAt = 0;
	function progress(current, total) {
		setProgress(current, total);
		if (!loadedAt && total > 0 && current >= total) {
			loadedAt = 1;
			setTimeout(function () {
				if (settled) { return; }
				const why = errors.length ? errors.join('\n') : 'engine did not start (stuck after download)';
				bootFailed(new Error(why), 'stuck');
			}, 45000);
		}
	}
	function start(useIdb) {
		const opts = { onProgress: progress, canvasResizePolicy: 0,
			onPrintError: function () {
				const line = Array.prototype.slice.call(arguments).join(' ');
				if (/error|fail|abort/i.test(line)) { note(line); }
				console.error(line);
			} };
		if (!useIdb) { opts.persistentPaths = []; }
		engine.startGame(opts).then(function () {
			if (settled) { return; }
			settled = true;
			hide();
			loaded(true);
		}, function (err) {
			bootFailed(err, 'start');
		});
	}
	// IndexedDB: нет совсем или ошибка — Godot справится сам; не ответил — запускаем без него.
	function probeIdb(done) {
		let idb = null;
		try { idb = window.indexedDB; } catch (e) { idb = null; }
		if (!idb || typeof idb.open !== 'function') { done(true); return; }
		let finished = false;
		const finish = function (ok) {
			if (finished) { return; }
			finished = true;
			if (!ok) { note('IndexedDB did not answer: started without local save'); }
			done(ok);
		};
		setTimeout(function () { finish(false); }, 4000);
		try {
			const req = idb.open('shikaku_probe');
			req.onsuccess = function () { try { req.result.close(); } catch (e) {} finish(true); };
			req.onerror = function () { finish(true); };
			req.onblocked = function () { finish(true); };
		} catch (e) { finish(true); }
	}
	probeIdb(start);
}());
</script>
